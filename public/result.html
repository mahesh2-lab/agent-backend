<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recent Evaluations</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 16px;
      }
      h1 {
        margin-bottom: 8px;
      }
      #list {
        margin-top: 12px;
      }
      .item {
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 6px;
      }
      .meta {
        color: #555;
        font-size: 0.9rem;
        margin-bottom: 6px;
      }
      .summary {
        font-weight: 600;
      }
      .btn {
        background: #0078d4;
        color: #fff;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn:active {
        transform: translateY(1px);
      }
      /* Modal */
      .modal {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
      }
      .modal.open {
        display: flex;
      }
      .modal-content {
        background: white;
        max-width: 900px;
        width: 95%;
        max-height: 85%;
        overflow: auto;
        padding: 16px;
        border-radius: 6px;
      }
      pre {
        white-space: pre-wrap;
        word-wrap: break-word;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <h1>Last 10 Evaluations</h1>
    <p id="status">Loading...</p>
    <div id="list"></div>

    <div id="modal" class="modal" role="dialog" aria-modal="true">
      <div class="modal-content">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
          "
        >
          <strong>Evaluation details</strong>
          <button id="closeModal" class="btn">Close</button>
        </div>
        <pre id="modalBody"></pre>
      </div>
    </div>

    <script>
      async function fetchRecent(limit = 10) {
        const statusEl = document.getElementById("status");
        try {
          statusEl.textContent = "Loading...";
          const res = await fetch(
            "/api/analysis/recent?limit=" + encodeURIComponent(limit)
          );
          if (!res.ok) throw new Error("Network error: " + res.status);
          const json = await res.json();
          if (json.status !== "success") {
            statusEl.textContent = "No results found.";
            return [];
          }
          statusEl.textContent = "";
          return json.analyses || [];
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Failed to load evaluations.";
          return [];
        }
      }

      function shortSummaryFromAnalysis(analysis) {
        if (!analysis) return "-";
        // Try some common fields
        if (analysis.summary) return analysis.summary;
        if (analysis.match_analysis && analysis.match_analysis.summary)
          return analysis.match_analysis.summary;
        if (analysis.overall && analysis.overall.summary)
          return analysis.overall.summary;
        // fallback to stringified small snippet
        try {
          return (
            JSON.stringify(analysis).slice(0, 180) +
            (JSON.stringify(analysis).length > 180 ? "…" : "")
          );
        } catch (e) {
          return "-";
        }
      }

      function renderList(items) {
        const list = document.getElementById("list");
        list.innerHTML = "";
        if (!items.length) {
          list.innerHTML = "<div>No evaluations yet.</div>";
          return;
        }

        items.forEach((it) => {
          const div = document.createElement("div");
          div.className = "item";

          const meta = document.createElement("div");
          meta.className = "meta";
          const date = new Date(it.createdAt);
          meta.textContent = `${it.name || ""} — ${
            it.roomName || ""
          } — ${date.toLocaleString()}`;

          const summary = document.createElement("div");
          summary.className = "summary";
          summary.textContent = shortSummaryFromAnalysis(
            it.analysis || it.analysis === null ? it.analysis : null
          );

          const actions = document.createElement("div");
          actions.style.marginTop = "8px";
          const viewBtn = document.createElement("button");
          viewBtn.className = "btn";
          viewBtn.textContent = "View full";
          viewBtn.addEventListener("click", () => openModal(it));

          actions.appendChild(viewBtn);

          div.appendChild(meta);
          div.appendChild(summary);
          div.appendChild(actions);

          list.appendChild(div);
        });
      }

      function openModal(item) {
        const modal = document.getElementById("modal");
        const body = document.getElementById("modalBody");
        body.textContent = JSON.stringify(item, null, 2);
        modal.classList.add("open");
      }

      function closeModal() {
        document.getElementById("modal").classList.remove("open");
      }

      document
        .getElementById("closeModal")
        .addEventListener("click", closeModal);
      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });

      // load on start
      (async () => {
        const items = await fetchRecent(10);
        renderList(items);
      })();
    </script>
  </body>
</html>
