<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Alles Solutions — Resume Parser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <div class="logo-mark" aria-hidden="true">
            <!-- simple mark -->
            <svg
              width="36"
              height="36"
              viewBox="0 0 36 36"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect width="36" height="36" rx="8" fill="#FF6B35" />
              <path
                d="M9 23L15 13L21 23"
                stroke="#fff"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <div class="brand-text">
            <strong>Alles Solutions</strong>
            <small>Resume Parser</small>
          </div>
        </div>

        <nav class="nav" aria-label="Primary">
          <a href="#" class="nav-link">Home</a>
          <a href="#results" class="nav-link">Results</a>
        </nav>
      </div>

      <div class="header-wave">
        <svg
          preserveAspectRatio="none"
          xmlns="http://www.w3.org/2000/svg"
          width="100%"
          height="120"
          viewBox="0 0 1440 120"
        >
          <defs>
            <linearGradient id="g1" x1="0" x2="1">
              <stop offset="0" stop-color="#0B2545" stop-opacity="0.12" />
              <stop offset="1" stop-color="#FF6B35" stop-opacity="0.06" />
            </linearGradient>
          </defs>
          <path
            d="M0,40 C240,140 360,0 720,40 C1080,80 1200,20 1440,40 L1440 120 L0 120 Z"
            fill="url(#g1)"
          />
        </svg>
      </div>
    </header>

    <main class="main">
      <div class="layout">
        <section class="upload-card card">
          <div class="card-inner">
            <h1 class="card-title">Parse a resume</h1>
            <p class="muted">
              Upload a PDF or plain text resume. Optionally paste a job
              description to get a match analysis.
            </p>

            <form id="upload-form" class="form">
              <label class="form-label" for="file">Resume (PDF or text)</label>
              <div class="file-row">
                <input
                  type="file"
                  id="file"
                  name="file"
                  accept="application/pdf,text/plain,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
                />
              </div>

              <label class="form-label" for="job_description"
                >Job description (optional)</label
              >
              <textarea
                id="job_description"
                name="job_description"
                rows="6"
                class="job-default"
              >
We are looking for motivated and innovative Engineering Graduates who are eager to apply their technical knowledge, problem-solving abilities, and creativity to real-world challenges. The role involves learning and contributing to projects in design, development, analysis, and implementation while working with cross-functional teams. Candidates should demonstrate strong analytical thinking, teamwork, adaptability, and a willingness to learn emerging tools and technologies. This position offers opportunities to gain hands-on experience, develop industry-ready skills, and grow into a professional role that contributes to impactful solutions in their respective engineering fields.</textarea
              >

              <div class="form-actions">
                <button id="submit" type="submit" class="btn btn-primary">
                  <span class="btn-label">Parse Resume</span>
                  <!-- spinner is hidden by default; `script.js` toggles the 'hidden' class -->
                  <span class="spinner hidden" aria-hidden="true"></span>
                </button>
                <div id="status" class="status" aria-live="polite"></div>
              </div>
            </form>

            <!-- Results table for multiple uploads (moved to result section) -->
          </div>
        </section>
      </div>

      <!-- Move the results card below the upload section for a single-column layout -->
      <section class="result-card card" id="results">
        <div class="card-inner">
          <h2 class="card-title">Result</h2>
          <!-- Container for multi-file results table (populated by static/app.js) -->
          <div
            id="results-table-container"
            class="results-table-wrapper"
            aria-live="polite"
          >
            No resume parsed yet.
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        © <span id="year">2025</span> Alles Solutions — Built with care
      </div>
    </footer>

    <!-- Candidate info modal -->
    <div
      id="candidate-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
    >
      <div class="modal-overlay" data-modal-close></div>
      <div class="modal-dialog" role="document">
        <header class="modal-header">
          <h3 id="modal-title">Candidate details</h3>
          <button id="modal-close" class="btn" aria-label="Close">Close</button>
        </header>
        <div id="modal-content" class="modal-body">
          <!-- populated by JS -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
